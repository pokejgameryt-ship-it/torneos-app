<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bracket Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Orbitron:wght@400;700;900&family=Press+Start+2P&family=Roboto+Condensed:wght@400;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@400;500;600;700&family=Exo+2:wght@400;600;700;800;900&family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      font-family: var(--br-font, 'Inter', sans-serif);
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    :root {
      --pc: #d4af37; --pc2: #f5d77a;
      --bg-match: rgba(15,23,41,0.92);
      --border-match: rgba(71,85,105,0.5);
      --border-wb: rgba(59,130,246,0.6);
      --border-lb: rgba(239,68,68,0.6);
      --border-gf: rgba(234,179,8,0.7);
      --text-main: rgba(255,255,255,0.88);
      --text-dim: rgba(255,255,255,0.45);
      --text-tbd: rgba(255,255,255,0.2);
      --winner-bg: rgba(34,197,94,0.12);
      --winner-text: #4ade80;
      --connector: rgba(255,255,255,0.12);
      --connector-active: rgba(255,255,255,0.3);
    }

    #bracket-root {
      transform-origin: center center;
    }

    .bracket-header {
      text-align: center; margin-bottom: 12px;
      padding-top: 16px;
    }
    .bracket-title {
      font-size: 40px; font-weight: 800;
      letter-spacing: 9px; text-transform: uppercase;
      color: var(--pc);
    }
    .bracket-subtitle {
      font-size: 15px; font-weight: 400;
      letter-spacing: 5px; text-transform: uppercase;
      color: var(--text-dim); margin-top: 2px;
    }

    .section-labels {
      display: flex; gap: 12px; margin-bottom: 6px; padding-left: 10px;
    }
    .section-label {
      font-size: 12px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; padding: 4px 14px; border-radius: 4px;
      display: inline-block;
    }
    .lbl-wb { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .lbl-lb { background: rgba(239,68,68,0.15); color: #f87171; }
    .lbl-gf { background: rgba(234,179,8,0.15); color: #facc15; }

    .bracket-body { position: relative; }

    .round-col { position: absolute; top: 0; }
    .round-header {
      font-size: 12px; font-weight: 700; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px;
      text-align: center; white-space: nowrap;
    }

    .match-slot { position: absolute; display: flex; align-items: center; justify-content: center; }

    .match {
      width: 250px; border-radius: 6px; padding: 8px 12px;
      background: var(--bg-match); border: 2px solid var(--border-match);
      backdrop-filter: blur(6px);
    }
    .match.wb { border-left: 4px solid var(--border-wb); }
    .match.lb { border-left: 4px solid var(--border-lb); }
    .match.gf { border-left: 4px solid var(--border-gf); }
    .match.completed { border-color: rgba(34,197,94,0.45); }
    .match.in-progress {
      border-color: rgba(234,179,8,0.6);
      box-shadow: 0 0 18px rgba(234,179,8,0.15);
    }
    .match.current {
      border-color: var(--pc);
      box-shadow: 0 0 24px color-mix(in srgb, var(--pc) 30%, transparent);
    }

    .m-player {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 10px; border-radius: 3px; margin-bottom: 2px;
    }
    .m-player:last-child { margin-bottom: 0; }
    .m-player.winner { background: var(--winner-bg); }
    .m-player .name {
      font-size: 15px; font-weight: 600; color: var(--text-main);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 175px;
    }
    .m-player.winner .name { color: var(--winner-text); }
    .m-player .name.tbd { color: var(--text-tbd); font-style: italic; }
    .m-player .score {
      font-size: 15px; font-weight: 700; color: var(--text-dim);
      min-width: 20px; text-align: center;
    }
    .m-player.winner .score { color: var(--winner-text); }

    .m-status {
      font-size: 9px; text-align: center; margin-top: 2px;
      color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px;
    }
    .match.in-progress .m-status { color: #facc15; animation: pulse 2s infinite; }
    .match.current .m-status { color: var(--pc); font-weight: 700; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    #connectors-svg {
      position: absolute; top: 0; left: 0;
      pointer-events: none; z-index: 0;
    }
    #connectors-svg line {
      stroke: var(--connector); stroke-width: 2; fill: none;
    }
    #connectors-svg line.active {
      stroke: var(--connector-active); stroke-width: 2.5;
    }
  </style>
</head>
<body>
  <div id="bracket-root"></div>

  <script>
    const tid = window.location.pathname.split('/').pop();
    const root = document.getElementById('bracket-root');

    const fontMap = {
      'Inter': "'Inter', sans-serif", 'Orbitron': "'Orbitron', sans-serif",
      'Press Start 2P': "'Press Start 2P', cursive",
      'Roboto Condensed': "'Roboto Condensed', sans-serif",
      'Rajdhani': "'Rajdhani', sans-serif", 'Teko': "'Teko', sans-serif",
      'Exo 2': "'Exo 2', sans-serif", 'Oswald': "'Oswald', sans-serif",
      'Barlow Condensed': "'Barlow Condensed', sans-serif",
    };

    const COL_W = 280;
    const MATCH_H = 72;
    const SLOT_PAD = 6;
    const HEADER_H = 80;
    const LABELS_H = 35;
    const ROUND_HEADER_H = 26;
    const GAP_BETWEEN_SECTIONS = 30;
    const PADDING = 30;

    async function load() {
      try {
        const [settingsRes, bracketRes] = await Promise.all([
          fetch('/api/overlay-settings/' + tid),
          fetch('/api/bracket/' + tid)
        ]);
        const settings = await settingsRes.json();
        const data = await bracketRes.json();

        document.documentElement.style.setProperty('--pc', settings.pc || '#d4af37');
        document.documentElement.style.setProperty('--pc2', settings.pc2 || '#f5d77a');
        document.documentElement.style.setProperty('--br-font', fontMap[settings.font] || fontMap['Inter']);

        render(data, settings);
      } catch(e) {
        console.error('Bracket load error:', e);
      }
    }

    function slotH(round, spacing) {
      return (MATCH_H + SLOT_PAD) * Math.pow(spacing, round - 1);
    }

    function matchY(round, position, spacing) {
      const sH = slotH(round, spacing);
      return (position - 1) * sH + sH / 2 - MATCH_H / 2;
    }

    function maxRound(matches) {
      return matches.length > 0 ? Math.max(...matches.map(m => m.round)) : 0;
    }

    function calcSpacing(winners, losers, wbR, lbR, targetH) {
      const baseH = MATCH_H + SLOT_PAD;
      const fixedH = HEADER_H + LABELS_H + ROUND_HEADER_H + GAP_BETWEEN_SECTIONS + ROUND_HEADER_H + PADDING * 2;
      const available = targetH - fixedH;

      function trySpacing(s) {
        let maxH = 0;
        for (let r = 1; r <= wbR; r++) {
          const count = winners.filter(m => m.round === r).length;
          maxH = Math.max(maxH, count * baseH * Math.pow(s, r - 1));
        }
        for (let r = 1; r <= lbR; r++) {
          const count = losers.filter(m => m.round === r).length;
          maxH = Math.max(maxH, count * baseH * Math.pow(s, r - 1));
        }
        return maxH;
      }

      let lo = 1.0, hi = 2.0;
      for (let i = 0; i < 20; i++) {
        const mid = (lo + hi) / 2;
        if (trySpacing(mid) <= available) lo = mid;
        else hi = mid;
      }
      return lo;
    }

    function render(data, settings) {
      if (!data || !data.bracket) return;
      const { winners, losers, grandFinal } = data.bracket;
      const tournament = data.tournament;
      const currentOrder = tournament.current_match_order || 0;

      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const wbR = maxRound(winners);
      const lbR = maxRound(losers);
      const totalRounds = Math.max(wbR, lbR);
      const gfCol = totalRounds + 1;

      const fixedH = HEADER_H + LABELS_H + ROUND_HEADER_H + GAP_BETWEEN_SECTIONS + ROUND_HEADER_H + PADDING * 2;
      const spacing = calcSpacing(winners, losers, wbR, lbR, vh);

      function sectionHeight(matches, maxR) {
        if (maxR === 0) return 0;
        let maxH = 0;
        for (let r = 1; r <= maxR; r++) {
          const count = matches.filter(m => m.round === r).length;
          const h = count * slotH(r, spacing);
          if (h > maxH) maxH = h;
        }
        return maxH;
      }

      const wbH = sectionHeight(winners, wbR);
      const lbH = sectionHeight(losers, lbR);

      const naturalW = PADDING * 2 + (gfCol + 1) * COL_W;
      const naturalH = fixedH + wbH + (losers.length > 0 ? lbH : 0);

      const scale = Math.min(vw / naturalW, vh / naturalH);

      root.style.width = naturalW + 'px';
      root.style.height = naturalH + 'px';
      root.style.transform = `scale(${scale})`;

      let html = '';

      html += `<div class="bracket-header">`;
      html += `<div class="bracket-title">${tournament?.name || 'Tournament'}</div>`;
      html += `<div class="bracket-subtitle">${tournament?.elimination_type === 'double' ? 'Double Elimination' : 'Single Elimination'}</div>`;
      html += `</div>`;

      html += `<div class="section-labels">`;
      html += `<div class="section-label lbl-wb">Winners Bracket</div>`;
      if (losers.length > 0) html += `<div class="section-label lbl-lb">Losers Bracket</div>`;
      if (grandFinal.length > 0) html += `<div class="section-label lbl-gf">Grand Final</div>`;
      html += `</div>`;

      html += `<div class="bracket-body" id="bracket-body" style="width:${naturalW}px; height:${naturalH - HEADER_H - LABELS_H}px;">`;
      html += `<svg id="connectors-svg" width="${naturalW}" height="${naturalH - HEADER_H - LABELS_H}"></svg>`;

      for (let round = 1; round <= wbR; round++) {
        const rMatches = winners.filter(m => m.round === round).sort((a, b) => a.position - b.position);
        const rName = rMatches[0]?.round_name || `Round ${round}`;
        const left = PADDING + (round - 1) * COL_W;

        html += `<div class="round-col" style="left:${left}px;">`;
        html += `<div class="round-header">${rName}</div>`;
        for (const m of rMatches) {
          const y = ROUND_HEADER_H + matchY(round, m.position, spacing);
          html += `<div class="match-slot" data-id="${m.id}" style="top:${y}px; height:${MATCH_H}px;">`;
          html += renderMatch(m, 'wb', currentOrder);
          html += `</div>`;
        }
        html += `</div>`;
      }

      for (let round = 1; round <= lbR; round++) {
        const rMatches = losers.filter(m => m.round === round).sort((a, b) => a.position - b.position);
        const rName = rMatches[0]?.round_name || `Round ${round}`;
        const left = PADDING + (round - 1) * COL_W;
        const lbOffset = ROUND_HEADER_H + wbH + GAP_BETWEEN_SECTIONS;

        html += `<div class="round-col" style="left:${left}px;">`;
        html += `<div class="round-header" style="margin-top:${lbOffset}px;">${rName}</div>`;
        for (const m of rMatches) {
          const y = lbOffset + ROUND_HEADER_H + matchY(round, m.position, spacing);
          html += `<div class="match-slot" data-id="${m.id}" style="top:${y}px; height:${MATCH_H}px;">`;
          html += renderMatch(m, 'lb', currentOrder);
          html += `</div>`;
        }
        html += `</div>`;
      }

      if (grandFinal.length > 0) {
        const gfLeft = PADDING + (gfCol - 1) * COL_W;
        const wbCenterY = ROUND_HEADER_H + wbH / 2;
        const lbCenterY = ROUND_HEADER_H + wbH + GAP_BETWEEN_SECTIONS + ROUND_HEADER_H + lbH / 2;
        const gfY = (losers.length > 0 ? (wbCenterY + lbCenterY) / 2 : wbCenterY) - MATCH_H / 2;

        html += `<div class="round-col" style="left:${gfLeft}px;">`;
        html += `<div class="round-header">Grand Final</div>`;
        html += `<div class="match-slot" data-id="${grandFinal[0].id}" style="top:${gfY}px; height:${MATCH_H}px;">`;
        html += renderMatch(grandFinal[0], 'gf', currentOrder);
        html += `</div>`;
        html += `</div>`;
      }

      html += `</div>`;

      root.innerHTML = html;

      requestAnimationFrame(() => drawConnectors(winners, losers, grandFinal));
    }

    function renderMatch(m, type, currentOrder) {
      const sc = m.status === 'completed' ? ' completed' : m.status === 'in_progress' ? ' in-progress' : '';
      const ic = m.match_order === currentOrder ? ' current' : '';
      const p1w = m.winner_id === m.player1_id ? ' winner' : '';
      const p2w = m.winner_id === m.player2_id ? ' winner' : '';
      const c1 = m.player1 ? '' : ' tbd';
      const c2 = m.player2 ? '' : ' tbd';

      let st = '○';
      if (m.status === 'bye') st = 'BYE';
      else if (m.status === 'completed') st = '✓';
      else if (m.status === 'in_progress' && m.match_order === currentOrder) st = '● LIVE';
      else if (m.status === 'in_progress') st = '○';

      return `<div class="match ${type}${sc}${ic}" data-match-id="${m.id}">
        <div class="m-player${p1w}"><span class="name${c1}">${m.player1?.name || 'TBD'}</span><span class="score">${m.player1_score || 0}</span></div>
        <div class="m-player${p2w}"><span class="name${c2}">${m.player2?.name || 'TBD'}</span><span class="score">${m.player2_score || 0}</span></div>
        <div class="m-status">${st}</div>
      </div>`;
    }

    function drawConnectors(winners, losers, grandFinal) {
      const body = document.getElementById('bracket-body');
      const svg = document.getElementById('connectors-svg');
      if (!body || !svg) return;

      let lines = '';

      function slotInfo(id) {
        const el = body.querySelector(`[data-id="${id}"]`);
        if (!el) return null;
        const r = el.getBoundingClientRect();
        const b = body.getBoundingClientRect();
        const scale = b.width / body.offsetWidth;
        return {
          cx: (r.left - b.left + r.width / 2) / scale,
          cy: (r.top - b.top + r.height / 2) / scale,
          right: (r.right - b.left) / scale,
          left: (r.left - b.left) / scale
        };
      }

      function drawLineActive(fromId, toId, isActive) {
        const from = slotInfo(fromId);
        const to = slotInfo(toId);
        if (!from || !to) return;
        const mx = (from.right + to.left) / 2;
        const cls = isActive ? ' active' : '';
        lines += `<line x1="${from.right}" y1="${from.cy}" x2="${mx}" y2="${from.cy}" class="${cls}"/>`;
        lines += `<line x1="${mx}" y1="${from.cy}" x2="${mx}" y2="${to.cy}" class="${cls}"/>`;
        lines += `<line x1="${mx}" y1="${to.cy}" x2="${to.left}" y2="${to.cy}" class="${cls}"/>`;
      }

      winners.forEach(m => {
        if (m.next_match_id) drawLineActive(m.id, m.next_match_id, m.status === 'completed');
      });

      losers.forEach(m => {
        if (m.next_match_id) drawLineActive(m.id, m.next_match_id, m.status === 'completed');
      });

      if (grandFinal.length > 0) {
        const gf = grandFinal[0];
        if (winners.length > 0) {
          const wf = [...winners].sort((a, b) => b.round - a.round)[0];
          if (wf) drawLineActive(wf.id, gf.id, wf.status === 'completed');
        }
        if (losers.length > 0) {
          const lf = [...losers].sort((a, b) => b.round - a.round)[0];
          if (lf) drawLineActive(lf.id, gf.id, lf.status === 'completed');
        }
      }

      svg.innerHTML = lines;
    }

    load();
    setInterval(load, 3000);
  </script>
</body>
</html>
